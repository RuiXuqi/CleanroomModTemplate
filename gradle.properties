# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
# Show test standard output and error in the console
show_testing_output = false

# Shadow
# This will rename the 'dev' jar to 'plain' and replace 'dev' with a shaded jar
# Deps will be shaded into the final obf jar with no suffix too
enable_shadow = false

# Mod Information
# HIGHLY RECOMMEND complying with SemVer for mod_version: https://semver.org/
mod_version = 1.0.0
# Package used as group in maven publishing and as the project's `group`
root_package = com.example
mod_id = modid
mod_name = Mod Name

# Mod Metadata (Optional)
mod_description =
mod_url =
# A url where the mod's update JSON can be fetched
# Wiki: https://docs.minecraftforge.net/en/1.12.x/gettingstarted/autoupdate/#forge-update-checker
# Also see: https://forge.curseupdate.com + https://docs.modrinth.com/api/operations/forgeupdates
mod_update_json =
# Delimit multiple authors with commas. Eg: Author1,Author2
mod_authors =
mod_credits =
# Path to a png file. Eg: assets/${mod_id}/logo.png
mod_logo_path =

# Cleanroom Extra Metadata (Optional)
# License of the mod, an SPDX identifier is preferred. Eg: MIT
mod_license =
mod_issue_tracker_url =
# Path to a square png file
mod_icon_path =
# An item to be rendered as the mod icon in Catalogue mod list,
# Formatted as modid:item_name(:meta)
# Final icon will be mod_icon_path if path is not empty.
mod_icon_item =
# Path to a png file
# Aspect-preserving cover cropping to fill the details panel, then faded out toward the bottom
mod_background_path =

# Run Configurations
minecraft_username = Dev
# Delimit multiple arguments with spaces
extra_jvm_args =
# Print extra foundation (Cleanroom's patching framework) diagnostics
enable_foundation_debug = false

# Maven Publishing
# Credentials are looked up by repository name, which is `maven_name` with spaces removed, plus
# `Username` / `Password`. The default below therefore expects `ModNameUsername` and `ModNamePassword`.
# They are only required when a publishing task actually runs.
publish_to_maven = false
maven_name = ${mod_name}
maven_url =
# Good for debugging artifacts before uploading to remote maven: run `./gradlew publishToMavenLocal`

# If any properties change below this line, refresh gradle again to ensure everything is working correctly.
# ----------------------------------------------------------------------------------------------------------------------

# Access Transformers
# A way to change visibility of Minecraft's classes, methods and fields
# AT files belong in the root of src/main/resources, and every filename must end with `_at.cfg` (eg: ${mod_id}_at.cfg)
# NOTE: Unimined does not support multiple AT files. Leave only one there.
# WARNING: Use MCP name in AT file. Unimined will remap it to srg name when building.
use_access_transformer = true
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
# Powerful tool to do runtime modification of classes
# Only use mixins once you understand the underlying structure
use_mixins = true
# Delimit configuration filenames with commas
# You may run `./gradlew generateMixinJson` to generate missing ones
mixin_configs = ${mod_id}.mixins.json
# A refmap is a JSON that denotes mapping conversions, this JSON is generated automatically, with the name ${mod_id}.refmap.json
# Change this property to use a different name, only one name is accepted.
# NOTE: This does not apply to JSON files that already exist.
mixin_refmap = ${mod_id}.refmap.json

# Coremods
# The most powerful way to change java classes at runtime, it is however very primitive with little documentation.
# Only make a coremod if you are absolutely sure of what you are doing
# Change the property `coremod_includes_mod` to false if your coremod doesn't have a @Mod annotation
# You MUST state a class name for `coremod_plugin_class_name` if you are making a coremod, the class should implement `IFMLLoadingPlugin`
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =
